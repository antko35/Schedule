<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <title>Schedule · UI kit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../../colors_and_type.css"/>
  <link rel="stylesheet" href="kit.css"/>
  <style>
    body { margin: 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="mockData.js"></script>
  <script type="text/babel" src="Primitives.jsx"></script>
  <script type="text/babel" src="ScheduleComponents.jsx"></script>
  <script type="text/babel" src="SchedulePage.jsx"></script>
  <script type="text/babel" src="DepartmentsPage.jsx"></script>
  <script type="text/babel" src="ControlPanelPage.jsx"></script>

  <script type="text/babel">
    function App() {
      const [route, setRoute] = React.useState("/");
      const data = window.MOCK;
      return (
        <div className="app-root">
          <KitChrome route={route} onNavigate={setRoute}/>
          <NavPill route={route} onNavigate={setRoute}/>
          <div className="page-frame">
            {route === "/" && <SchedulePage data={data} onNavigate={setRoute}/>}
            {route === "/departments" && <DepartmentsPage data={data}/>}
            {route === "/control" && <ControlPanelPage data={data}/>}
            {route === "/redact" && <SchedulePage data={data} onNavigate={setRoute}/>}
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
