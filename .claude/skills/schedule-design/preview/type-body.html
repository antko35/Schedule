<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--bg-app);color:var(--fg);font-family:var(--font-sans)}
.wrap{padding:18px}
.spec{display:flex;align-items:baseline;gap:18px;padding:10px 0;border-bottom:1px solid #3a3a3a}
.spec:last-child{border-bottom:none}
.lbl{font-family:ui-monospace,monospace;color:var(--fg-muted);font-size:11px;min-width:80px}
.size{color:var(--fg-quiet);font-size:11px;margin-left:auto}
</style></head><body>
<div class="wrap">
<div class="spec"><span class="lbl">body / 16</span><span style="font-size:16px">Иванов И. И. — 01.04.1985</span><span class="size">Inter · capitalize</span></div>
<div class="spec"><span class="lbl">sidebar / 17</span><span style="font-size:17px">Добавить работника</span><span class="size">sidebar link</span></div>
<div class="spec"><span class="lbl">label / 18</span><span style="font-size:18px;text-transform:uppercase">фамилия</span><span class="size">form label</span></div>
<div class="spec"><span class="lbl">day / 20</span><span style="font-size:20px">08:00 — 14:30</span><span class="size">calendar day cell</span></div>
<div class="spec"><span class="lbl">divider / 35</span><span style="font-family:Georgia,serif;font-weight:bold;font-size:35px;color:var(--fg-muted)">А</span><span class="size">Georgia · letter divider</span></div>
</div>
</body></html>
