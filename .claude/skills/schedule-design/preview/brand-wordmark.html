<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--bg-app);color:var(--fg);font-family:var(--font-sans)}
.wrap{padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px;justify-content:center;height:100%;box-sizing:border-box}
.mark{display:flex;align-items:center;gap:14px}
.dot{width:48px;height:48px;border-radius:14px;background:#383837;display:flex;align-items:center;justify-content:center;border-bottom:3px solid #6bff6b}
.dot::after{content:"";width:18px;height:18px;border-radius:5px;background:#6bff6b}
.word{font-size:32px;text-transform:uppercase;letter-spacing:.04em;color:#fff;font-weight:600}
.tagline{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:var(--fg-muted)}
</style></head><body>
<div class="wrap">
<div class="mark"><div class="dot"></div><div class="word">расписание</div></div>
<div class="tagline">placeholder · brand has no logo in repo</div>
</div>
</body></html>
