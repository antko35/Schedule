<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--bg-app);color:var(--fg);font-family:var(--font-sans)}
.wrap{padding:14px;display:flex;justify-content:center}
.pill{background:#383837;border-radius:35px;padding:10px 30px;display:flex;gap:50px;border-bottom:3px solid #6bff6b}
.pill p{margin:0;text-transform:uppercase;font-size:14px;color:#c4c4c4}
.pill p.active{color:#fff;text-decoration:underline;transform:scale(1.08)}
</style></head><body>
<div class="wrap"><div class="pill">
<p class="active">расписание</p>
<p>отделения</p>
<p>панель управления</p>
</div></div>
</body></html>
