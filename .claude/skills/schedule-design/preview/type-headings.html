<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--bg-app);color:var(--fg);font-family:var(--font-sans)}
.wrap{padding:18px}
.spec{display:flex;align-items:baseline;gap:18px;padding:10px 0;border-bottom:1px solid #3a3a3a}
.spec:last-child{border-bottom:none}
.lbl{font-family:ui-monospace,monospace;color:var(--fg-muted);font-size:11px;min-width:80px}
.size{color:var(--fg-quiet);font-size:11px;margin-left:auto}
.up{text-transform:uppercase}
</style></head><body>
<div class="wrap" style="font-family:'Inter',sans-serif">
<div class="spec"><span class="lbl">h1 / 20</span><span class="up" style="font-size:20px">укажите работника</span><span class="size">Inter 400 · UPPERCASE</span></div>
<div class="spec"><span class="lbl">h2 / 22</span><span class="up" style="font-size:22px">работники</span><span class="size">sidebar group</span></div>
<div class="spec"><span class="lbl">form / 25</span><span class="up" style="font-size:25px">добавить работника</span><span class="size">form header</span></div>
<div class="spec"><span class="lbl">year / 30</span><span class="up" style="font-size:30px">2025</span><span class="size">calendar year</span></div>
<div class="spec"><span class="lbl">month / 36</span><span class="up" style="font-size:36px;text-decoration:underline">август</span><span class="size">calendar month</span></div>
</div>
</body></html>
