<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--bg-app);color:var(--fg)}
.card{padding:20px;font-family:var(--font-sans)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.swatch{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;color:#fff;font-size:11px;line-height:1.25}
.swatch code{display:block;opacity:.7;font-size:10px;font-family:ui-monospace,monospace}
</style></head><body><div class="card"><div class="grid">
<div class="swatch" style="background:#2a2a2a;border:1px solid #444">bg-app<code>#2a2a2a</code></div>
<div class="swatch" style="background:#383837">bg-elevated<code>#383837</code></div>
<div class="swatch" style="background:#474747">bg-surface<code>#474747</code></div>
<div class="swatch" style="background:#494949">bg-surface-2<code>#494949</code></div>
<div class="swatch" style="background:#555">bg-surface-3<code>#555555</code></div>
<div class="swatch" style="background:#585656">bg-surface-4<code>#585656</code></div>
<div class="swatch" style="background:#484848">bg-row<code>#484848</code></div>
<div class="swatch" style="background:#717171">bg-row-hover<code>#717171</code></div>
<div class="swatch" style="background:#7d7d7d">bg-row-active<code>#7d7d7d</code></div>
<div class="swatch" style="background:#a8a8a8;color:#222">bg-row-light<code>#a8a8a8</code></div>
</div></div></body></html>
