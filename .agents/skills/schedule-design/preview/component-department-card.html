<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--bg-app);color:var(--fg);font-family:var(--font-sans)}
.wrap{padding:18px}
.card{background:#555;border-radius:20px;overflow:hidden}
.card .header{background:#424242;padding:12px 18px;color:#c0c0c0;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase}
.card .header h1{margin:0;font-size:18px}
.row{background:#494949;border-radius:20px;margin:10px;padding:8px 12px;color:#c0c0c0;display:flex;align-items:center;gap:12px}
.av{width:36px;height:36px;border-radius:50%;background:#3a3a3a}
.row .meta{flex:1}
.row .meta .name{font-weight:bold;color:#eee;font-size:14px}
.row .meta .date{font-size:11px;color:#fff;opacity:.75;margin-top:2px}
.div-letter{font-family:Georgia,serif;font-weight:bold;font-size:30px;color:#c0c0c0;padding:6px 12px;border-bottom:1px solid #777;width:28px}
</style></head><body>
<div class="wrap"><div class="card">
<div class="header"><h1>хирургия (2)</h1><span style="opacity:.5">▼</span></div>
<div class="div-letter">И</div>
<div class="row"><div class="av"></div><div class="meta"><div class="name">Иванов Иван Иванович</div><div class="date">01.04.1985</div></div><span style="opacity:.5">▼</span></div>
<div class="row"><div class="av"></div><div class="meta"><div class="name">Иваненко Ольга Петровна</div><div class="date">22.11.1990</div></div><span style="opacity:.5">▼</span></div>
</div></div>
</body></html>
