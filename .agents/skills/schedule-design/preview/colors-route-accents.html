<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--bg-app);color:var(--fg);font-family:var(--font-sans)}
.wrap{padding:18px}
.row{display:flex;gap:10px;margin-bottom:14px}
.tile{flex:1;border-radius:14px;padding:14px;color:#fff;min-height:90px;display:flex;flex-direction:column;justify-content:space-between}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.04em;opacity:.85}
.hex{font-family:ui-monospace,monospace;font-size:12px;opacity:.85}
h3{font-size:11px;text-transform:uppercase;margin:0 0 6px 0;letter-spacing:.06em;color:var(--fg-muted)}
.section{margin-bottom:6px}
</style></head><body>
<div class="wrap">
<div class="section"><h3>route accents (nav pill underline only)</h3><div class="row">
<div class="tile" style="background:#1f1f1f;border-bottom:4px solid #6bff6b"><span class="lbl">расписание</span><span class="hex">#6bff6b</span></div>
<div class="tile" style="background:#1f1f1f;border-bottom:4px solid #d8ff2b"><span class="lbl">отделения</span><span class="hex">#d8ff2b</span></div>
<div class="tile" style="background:#1f1f1f;border-bottom:4px solid #377bd3"><span class="lbl">панель управления</span><span class="hex">#377bd3</span></div>
<div class="tile" style="background:#1f1f1f;border-bottom:4px solid #ffd93d"><span class="lbl">default</span><span class="hex">#ffd93d</span></div>
</div></div>
</div>
</body></html>
