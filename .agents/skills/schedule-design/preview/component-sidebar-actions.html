<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:var(--bg-app);color:var(--fg);font-family:var(--font-sans);}
  .frame{padding:22px 26px;display:grid;grid-template-columns:1fr 1fr;gap:28px;}
  .group{display:flex;flex-direction:column;gap:10px;}
  .group-label{
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--fg-quiet);font-weight:600;padding-left:4px;
  }
  ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:2px;}
  li{
    display:flex;align-items:center;gap:12px;
    padding:9px 12px;border-radius:10px;
    font-size:14px;font-weight:500;
    cursor:pointer;transition:background .15s ease, transform .1s ease;
    position:relative;
  }
  li .dot{
    width:8px;height:8px;border-radius:50%;flex-shrink:0;
    box-shadow:0 0 0 3px rgba(255,255,255,0.04);
  }
  li.add    .dot{background:var(--action-add);}
  li.delete .dot{background:var(--action-delete);}
  li.redact .dot{background:var(--action-redact);}
  li .label{flex:1;color:var(--fg);}
  li .kbd{
    font-family:var(--font-mono);font-size:10.5px;color:var(--fg-quiet);
    padding:2px 6px;border-radius:4px;border:1px solid var(--border-soft);
    background:rgba(0,0,0,.25);opacity:0;transition:opacity .15s;
  }
  li:hover{background:rgba(255,255,255,.05);}
  li:hover .kbd{opacity:1;}
  li.is-active{
    background:var(--bg-row-active);
  }
  li.is-active::before{
    content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;
    border-radius:0 3px 3px 0;
  }
  li.is-active.add::before    {background:var(--action-add);}
  li.is-active.delete::before {background:var(--action-delete);}
  li.is-active.redact::before {background:var(--action-redact);}
  .state-tag{
    margin-left:auto;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--fg-quiet);
  }
</style>
</head>
<body>
  <div class="frame">

    <div class="group">
      <div class="group-label">Работники</div>
      <ul>
        <li class="add">
          <span class="dot"></span>
          <span class="label">Добавить работника</span>
          <span class="kbd">N</span>
        </li>
        <li class="delete is-active">
          <span class="dot"></span>
          <span class="label">Удалить работника</span>
          <span class="state-tag">active</span>
        </li>
        <li class="redact">
          <span class="dot"></span>
          <span class="label">Изменить информацию</span>
          <span class="kbd">E</span>
        </li>
      </ul>
    </div>

    <div class="group">
      <div class="group-label">Отделения</div>
      <ul>
        <li class="add">
          <span class="dot"></span>
          <span class="label">Добавить отделение</span>
          <span class="kbd">⇧ N</span>
        </li>
        <li class="delete">
          <span class="dot"></span>
          <span class="label">Удалить отделение</span>
        </li>
        <li class="redact">
          <span class="dot"></span>
          <span class="label">Переименовать</span>
        </li>
      </ul>
    </div>

  </div>
</body>
</html>
