<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--bg-app);color:var(--fg);font-family:var(--font-sans)}
.wrap{padding:18px;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.tile{background:#3a3a3a;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 8px;gap:8px}
.tile img{height:36px;width:36px;opacity:.7;filter:invert(1)}
.tile span{font-size:10px;color:var(--fg-quiet);font-family:ui-monospace,monospace}
</style></head><body>
<div class="wrap">
<div class="tile"><img src="../assets/icons/chevron.svg"><span>chevron</span></div>
<div class="tile"><img src="../assets/icons/left-arrow.svg"><span>left-arrow</span></div>
<div class="tile"><img src="../assets/icons/right-arrow.svg"><span>right-arrow</span></div>
<div class="tile"><img src="../assets/icons/menu.svg"><span>menu</span></div>
<div class="tile"><img src="../assets/icons/close-menu.svg"><span>close-menu</span></div>
<div class="tile"><img src="../assets/icons/avatar.svg"><span>avatar</span></div>
<div class="tile"><img src="../assets/icons/weekend.svg"><span>weekend</span></div>
<div class="tile"><img src="../assets/icons/search.svg"><span>search</span></div>
<div class="tile"><img src="../assets/icons/redact.svg"><span>redact</span></div>
<div class="tile"><img src="../assets/icons/no-result.svg"><span>no-result</span></div>
</div>
</body></html>
