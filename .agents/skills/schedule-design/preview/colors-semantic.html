<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--bg-app);color:var(--fg);font-family:var(--font-sans)}
.wrap{padding:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{aspect-ratio:1.2;border-radius:14px;display:flex;flex-direction:column;justify-content:space-between;padding:14px;color:#fff}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.04em;opacity:.85}
.hex{font-family:ui-monospace,monospace;font-size:12px;opacity:.85}
</style></head><body>
<div class="wrap">
<div class="tile" style="background:#0d8126"><span class="lbl">1 смена · shift-first</span><span class="hex">#0d8126</span></div>
<div class="tile" style="background:#b95b18"><span class="lbl">2 смена · shift-second</span><span class="hex">#b95b18</span></div>
<div class="tile" style="background:#831111"><span class="lbl">выходной · weekend</span><span class="hex">#831111</span></div>
<div class="tile" style="background:#698c9c"><span class="lbl">selected doctor</span><span class="hex">#698c9c</span></div>
<div class="tile" style="background:#4caf50"><span class="lbl">submit · success</span><span class="hex">#4caf50</span></div>
<div class="tile" style="background:#04ff00;color:#0c2a0c"><span class="lbl">action · add</span><span class="hex">#04ff00</span></div>
<div class="tile" style="background:#ff0000"><span class="lbl">action · delete</span><span class="hex">#ff0000</span></div>
<div class="tile" style="background:#f6ff00;color:#1a1a00"><span class="lbl">action · redact</span><span class="hex">#f6ff00</span></div>
</div>
</body></html>
