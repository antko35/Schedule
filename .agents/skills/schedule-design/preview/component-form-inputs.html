<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--bg-app);color:var(--fg);font-family:var(--font-sans)}
.wrap{padding:18px;display:flex;flex-direction:column;gap:14px}
.line{display:flex;align-items:center;gap:20px}
.lbl{min-width:140px;text-transform:uppercase;font-size:13px;color:#dadada}
input,select{background:#585656;color:#fff;border:1px solid #ccc;border-radius:4px;height:38px;padding:0 10px;font-size:14px;flex:1;text-transform:capitalize}
select{appearance:none}
</style></head><body>
<div class="wrap">
<div class="line"><label class="lbl">фамилия</label><input value="Иванов" /></div>
<div class="line"><label class="lbl">дата рождения</label><input value="01.04.1985" /></div>
<div class="line"><label class="lbl">пол</label><select><option>мужской</option><option>женский</option></select></div>
</div>
</body></html>
