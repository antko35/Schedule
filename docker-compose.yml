services:
  rabbitmq:
    image: rabbitmq:4.0-management
    hostname: rabbitmq
    restart: always
    volumes:
      - ./rabbitmq:/var/lib/rabbitmq
    ports:
      - 15672:15672

  user-service:
    build:
      context: ./src/Services/UserService
      dockerfile: UserService.API/Dockerfile
    ports:
      - "5001:8080" # Локальный порт → Порт внутри контейнера
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_Kestrel__Certificates__Default__Password=password
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/server-cert.pfx
    depends_on:
      - user-service-pg-db
    volumes:
      - ./certs:/https:ro
    command: >
      sh -c "dotnet ef database update -s ./src/Services/UserService/UserService.API -p ./src/Services/UserService/Data &&
             dotnet UserService.API.dll"
  
  user-service-pg-db:
    image: postgres:latest
    ports:
      - "5434:5432" # Локальный порт → Порт внутри контейнера
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=users_db
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 10s
      retries: 5
      start_period: 20s


  pdAdmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@gmail.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    depends_on:
      user-service-pg-db:
        condition: service_healthy

  schedule-service:
    build:
      context: .
      dockerfile: src/Services/ScheduleService/ScheduleService.API/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__applicationDb=Host=application-db;Port=5432;Database=application_db;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      - ConnectionStrings__rabbitmq=amqp://guest:guest@rabbitmq:5672
      - Database__ApplyMigrationsOnStartup=true
      - Keycloak__PublicUrl=http://localhost:8080
      - services__keycloak__http__0=http://keycloak:8080
    depends_on:
      application-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      keycloak:
        condition: service_started

  application-db:
    image: postgres:17.6-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=application_db
    volumes:
      - application-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d application_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  user-management-service:
    build:
      context: ./src/Services/UserManagementService
      dockerfile: UserManagementService.API/Dockerfile
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Keycloak__PublicUrl=http://localhost:8080
      - services__keycloak__http__0=http://keycloak:8080
    depends_on:
      - management-mongo
      - keycloak
    volumes:
      - ./certs/server-cert.crt:/usr/local/share/ca-certificates/server-cert.crt:ro

  management-mongo:
    image: mongo:latest
    container_name: management-mongo
    ports:
      - "27017:27017" 
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=usermanagement_db
    volumes:
      - management-mongo-data:/data/db

  management-mongo-express:
    image: mongo-express:latest
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=password
      - ME_CONFIG_MONGODB_SERVER=management-mongo
        
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./containers/keycloak:/opt/keycloak/data
    user: root # development only

volumes:
  application-db-data:
  db-data:
  management-mongo-data:
