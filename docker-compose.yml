services:
  rabbitmq:
    image: rabbitmq:4.0-management
    hostname: rabbitmq
    restart: always
    volumes:
      - ./rabbitmq:/var/lib/rabbitmq
    ports:
      - 15672:15672

  pdAdmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@gmail.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    depends_on:
      application-db:
        condition: service_healthy

  schedule-service:
    build:
      context: .
      dockerfile: src/Services/ScheduleService/ScheduleService.API/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__applicationDb=Host=application-db;Port=5432;Database=application_db;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      - ConnectionStrings__rabbitmq=amqp://guest:guest@rabbitmq:5672
      - Database__ApplyMigrationsOnStartup=true
      - Keycloak__PublicUrl=http://localhost:8080
      - services__keycloak__http__0=http://keycloak:8080
    depends_on:
      application-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      keycloak:
        condition: service_started

  application-db:
    image: postgres:17.6-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=application_db
    volumes:
      - application-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d application_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  user-management-service:
    build:
      context: .
      dockerfile: src/Services/UserManagementService/UserManagementService.API/Dockerfile
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__applicationDb=Host=application-db;Port=5432;Database=application_db;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      - ConnectionStrings__rabbitmq=amqp://guest:guest@rabbitmq:5672
      - Database__ApplyMigrationsOnStartup=true
      - Keycloak__PublicUrl=http://localhost:8080
      - services__keycloak__http__0=http://keycloak:8080
    depends_on:
      application-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      keycloak:
        condition: service_started

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./containers/keycloak:/opt/keycloak/data
      - ./src/AppHost/keycloak:/opt/keycloak/data/import:ro
    user: root # development only

volumes:
  application-db-data:
